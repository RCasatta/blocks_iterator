name: blocks-iterator

on:
  push:
    branches:
      - master
  pull_request: {}

jobs:

  cosmetics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.88.0: MSRV (`rust-version` in Cargo.toml), same as rust-toolchain.toml
        toolchain: [stable, nightly, 1.88.0]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      # use explicit `+toolchain` so rust-toolchain.toml doesn't override the matrix
      - run: cargo +${{ matrix.toolchain }} test --no-default-features
      # rocksdb's bindgen needs libclang, which ubuntu-24.04 images don't ship
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
        if: ${{ matrix.toolchain == 'stable' || matrix.toolchain == '1.88.0' }}
      - run: cargo +${{ matrix.toolchain }} test --features db,redb,consensus
        if: ${{ matrix.toolchain == 'stable' || matrix.toolchain == '1.88.0' }}
      - run: cd benches && cargo +nightly bench
        if: ${{ matrix.toolchain == 'nightly' }}

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: ["verify --features consensus,rayon", "signatures_in_witness", "outputs_versions"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --example ${{ matrix.example }} -- --blocks-dir blocks --network testnet

  pipe-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --no-default-features
      - run: cargo build --release --examples
      - run: ./target/release/blocks_iterator_cli --blocks-dir blocks --network testnet --max-reorg 40 | ./target/release/examples/with_pipe
        # explicit bash enables pipefail, so a failing blocks_iterator_cli fails the step
        shell: bash
        timeout-minutes: 10

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          extra_nix_config: |
            trusted-public-keys = nix.casatta.it:HseKZh7436/vKXfZDBHbhr7wwAkzjLwY5BIq+OOrITg= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://nix.casatta.it https://cache.nixos.org/
      - run: nix build .
